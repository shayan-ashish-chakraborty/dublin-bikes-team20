<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bike dock station structure -->
  <rect x="6" y="46" width="52" height="6" rx="3" stroke="currentColor" stroke-width="3"/>
  <!-- Three bike slots -->
  <line x1="16" y1="46" x2="16" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="46" x2="48" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Mini bike wheels (simplified) -->
  <circle cx="16" cy="28" r="4" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="32" cy="28" r="4" stroke="currentColor" stroke-width="2.5"/>
  <!-- Empty slot marker -->
  <circle cx="48" cy="28" r="4" stroke="currentColor" stroke-width="2" stroke-dasharray="3,2" opacity="0.4"/>
  <!-- Status indicator -->
  <circle cx="52" cy="14" r="5" fill="currentColor" opacity="0.8"/>
  <line x1="50" y1="14" x2="52" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="16" x2="56" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
